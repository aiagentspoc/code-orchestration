[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-orchestration"
version = "0.1.0"
description = "Deterministic Code-Orchestrated HSE Editorial Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "pydantic>=2.0.0",
    "fastmcp>=0.1.0",
    "hse-easy-mock-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
hse-easy-mock-mcp = { path = "../mcp-server", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
